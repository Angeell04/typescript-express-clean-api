services:
  gym_sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gym_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TuPassword123*
    ports:
      - "1433:1433"
    volumes:
      - mssql_gym_data:/var/opt/mssql

volumes:
  mssql_gym_data:
